<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="rliLogoTitle rliLogoDesc">
  <title id="rliLogoTitle">RLI Manager</title>
  <desc id="rliLogoDesc">Logo RLI Manager — Registrazione Locazioni Immobiliari</desc>

  <defs>
    <linearGradient id="rliCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="rliDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
    <filter id="rliShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1f4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card di sfondo: garantisce leggibilità su tema chiaro e scuro -->
  <rect x="6" y="6" width="708" height="168" rx="30" fill="url(#rliCard)"/>
  <rect x="6" y="6" width="708" height="168" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- ===== Icona: documento/contratto con spunta fiscale ed edificio ===== -->
  <g filter="url(#rliShadow)">
    <!-- Edificio stilizzato (sfondo, a sinistra) -->
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="40" y="86" width="34" height="52" rx="4"/>
      <rect x="48" y="74" width="18" height="14" rx="3"/>
      <!-- finestre -->
      <g fill="#1e40af">
        <rect x="46" y="94" width="7" height="7" rx="1.5"/>
        <rect x="61" y="94" width="7" height="7" rx="1.5"/>
        <rect x="46" y="108" width="7" height="7" rx="1.5"/>
        <rect x="61" y="108" width="7" height="7" rx="1.5"/>
        <rect x="46" y="122" width="7" height="7" rx="1.5"/>
        <rect x="61" y="122" width="7" height="7" rx="1.5"/>
      </g>
    </g>

    <!-- Documento/contratto -->
    <path d="M78 34 h44 l26 26 v78 a8 8 0 0 1 -8 8 h-62 a8 8 0 0 1 -8 -8 v-96 a8 8 0 0 1 8 -8 z"
          fill="url(#rliDoc)"/>
    <!-- Angolo piegato -->
    <path d="M122 34 v18 a8 8 0 0 0 8 8 h18 z" fill="#c7d7ff"/>
    <!-- Righe di testo del contratto -->
    <g fill="#2563eb" fill-opacity="0.85">
      <rect x="86" y="70" width="46" height="5" rx="2.5"/>
      <rect x="86" y="82" width="46" height="5" rx="2.5"/>
      <rect x="86" y="94" width="34" height="5" rx="2.5"/>
    </g>

    <!-- Spunta fiscale (badge) -->
    <circle cx="128" cy="126" r="24" fill="#1e40af" stroke="#ffffff" stroke-width="3"/>
    <path d="M117 126 l7 7 l14 -15" fill="none" stroke="#ffffff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="196" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="0.5">RLI Manager</text>

  <!-- ===== Sottotitolo ===== -->
  <text x="198" y="122" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#dbe6ff" letter-spacing="0.3">Registrazione Locazioni Immobiliari</text>
</svg>
